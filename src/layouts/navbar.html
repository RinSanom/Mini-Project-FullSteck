<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-white">
    <nav class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 md:py-6 shadow-md bg-white">
        <div class="flex justify-between items-center">
            <a href="#" class="flex items-center space-x-2">
                <img src="../assets/Logo.png" alt="Furniro Logo" class="h-8 md:h-9 w-auto">
                <span class="text-2xl md:text-3xl font-bold text-gray-900">Furniro</span>
            </a>

            <div class="hidden md:flex items-center space-x-10 lg:space-x-16">
                <a href="#" class="text-gray-900 hover:text-gray-600 font-medium text-sm lg:text-base">Home</a>
                <a href="#" class="text-gray-900 hover:text-gray-600 font-medium text-sm lg:text-base">Shop</a>
                <a href="#" class="text-gray-900 hover:text-gray-600 font-medium text-sm lg:text-base">About</a>
                <a href="#" class="text-gray-900 hover:text-gray-600 font-medium text-sm lg:text-base">Contact</a>
            </div>

            <div class="hidden md:flex items-center space-x-4 lg:space-x-6">
                <a href="#" class="text-gray-900 hover:text-gray-600">
                    <i class="fa-solid fa-user fa-lg"></i>
                </a>
                <a href="#" class="text-gray-900 hover:text-gray-600">
                     <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                </a>
                <a href="#" class="text-gray-900 hover:text-gray-600">
                     <i class="fa-solid fa-heart fa-lg"></i>
                </a>
                <a href="#" class="text-gray-900 hover:text-gray-600">
                     <i class="fa-solid fa-cart-shopping fa-lg"></i>
                </a>
            </div>

            <div class="md:hidden flex items-center">
                 <button class="text-gray-900 focus:outline-none cursor-default">
                    <i class="fa-solid fa-bars fa-lg"></i>
                </button>
            </div>
        </div>

        <div class="md:hidden mt-4 border-t border-gray-100 pt-4 space-y-2">
             <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-800 hover:bg-gray-100">Home</a>
             <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-800 hover:bg-gray-100">Shop</a>
             <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-800 hover:bg-gray-100">About</a>
             <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-800 hover:bg-gray-100">Contact</a>
             <div class="flex items-center space-x-4 pt-4 px-3 border-t border-gray-100 mt-2">
                <a href="#" class="text-gray-800 hover:text-gray-600">
                    <i class="fa-solid fa-user fa-lg"></i>
                </a>
                <a href="#" class="text-gray-800 hover:text-gray-600">
                     <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                </a>
                <a href="#" class="text-gray-800 hover:text-gray-600">
                     <i class="fa-solid fa-heart fa-lg"></i>
                </a>
                <a href="#" class="text-gray-800 hover:text-gray-600">
                     <i class="fa-solid fa-cart-shopping fa-lg"></i>
                </a>
            </div>
        </div>
    </nav>


</body>
</html>
