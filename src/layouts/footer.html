<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white">

    <footer class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-8 mb-8 md:mb-12">
            <div class="md:col-span-12 lg:col-span-4">
                <h3 class="text-2xl font-bold text-gray-900 mb-4">Funiro.</h3>
                <p class="text-gray-500 text-sm leading-relaxed">
                    400 University Drive Suite 200 Coral Gables,<br>
                    FL 33134 USA
                </p>
            </div>

            <div class="md:col-span-4 lg:col-span-2">
                <h4 class="text-gray-400 font-medium mb-4 text-sm">Links</h4>
                <nav class="space-y-2 md:space-y-3">
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">Home</a>
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">Shop</a>
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">About</a>
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">Contact</a>
                </nav>
            </div>

            <div class="md:col-span-4 lg:col-span-3">
                <h4 class="text-gray-400 font-medium mb-4 text-sm">Help</h4>
                <nav class="space-y-2 md:space-y-3">
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">Payment Options</a>
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">Returns</a>
                    <a href="#" class="block text-gray-800 hover:text-gray-600 font-medium text-sm">Privacy Policies</a>
                </nav>
            </div>

            <div class="md:col-span-4 lg:col-span-3">
                <h4 class="text-gray-400 font-medium mb-4 text-sm">Newsletter</h4>
                <form class="flex space-x-2 sm:space-x-4 items-end">
                    <input type="email" placeholder="Enter Your Email Address" class="border-b border-black pb-0.5 bg-transparent focus:outline-none text-sm flex-grow placeholder:text-gray-400 placeholder:font-medium">
                    <button type="submit" class="border-b border-black pb-0.5 text-sm font-semibold hover:text-gray-600 focus:outline-none whitespace-nowrap">SUBSCRIBE</button>
                </form>
            </div>
        </div>

        <div class="border-t border-gray-200 pt-6 md:pt-8">
            <p class="text-gray-800 text-sm text-left">2023 furino. All rights reserved</p>
        </div>
    </footer>

</body>
</html>
